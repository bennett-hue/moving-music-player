  });
  }
  function go(){
  var el=document.querySelector(
  '.mm-tags');
  if(!el)return;
  fetch(U+P+Q).then(function(r){
  return r.json();
  }).then(function(d){
  if(!d.tags)return;
  var t=d.tags.filter(function(x){
  var c=x.count;
  return c&&c.posts>0;
  }).filter(function(x){
  var n=x.name;
  if(n.charAt(0)==='#')return false;
  if(x.slug.indexOf(
  'album-')===0)return false;
  var i=skip.indexOf(x.slug);
  return i===-1;
  });
  var pin=[
  'worksongs',
  'originals',
  'courage',
  'tunes'
  ];
  var top=[];
  var rest=[];
  t.forEach(function(x){
  var i=pin.indexOf(x.slug);
  if(i>-1){top[i]=x;}
  else{rest.push(x);}
  });
  rest.sort(function(a,b){
  return a.name.localeCompare(
  b.name);
  });
  var html='';

  top.forEach(function(x){

  html+='<div style="width:100%;';
  html+='height:0;"></div>';
  rest.forEach(function(x){
  var h=B+x.slug+'/">';
  html+=A+h+x.name+'</a>';
  });
  el.innerHTML=html;
  });
  }
  function applyFeedTags(){
  if(!tagMap)return;
  var sel='article.feed';
  var arts=document.querySelectorAll(
  sel);
  arts.forEach(function(a){
  var lk=a.querySelector(
  'a.u-permalink');
  if(!lk)return;
  var hr=lk.getAttribute('href');
  var s=hr.replace(/\//g,'');
  var tags=tagMap[s];
  if(!tags||!tags.length)return;
  var w=a.querySelector(
  '.feed-wrapper');
  if(!w)return;
  var q='.feed-tags';
  if(w.querySelector(q))return;
  var div=document.createElement(
  'div');
  div.className='feed-tags';
  div.innerHTML=tags.map(
  function(t){
  var h=B+t.slug+'/">';
  return A+h+t.name+'</a>';
  }).join('');
  var ti=w.querySelector(
  '.feed-title');
  if(ti){
  var row=document.createElement(
  'div');
  row.className='feed-title-row';
  ti.parentNode.insertBefore(
  row,ti);
  row.appendChild(ti);
  row.appendChild(div);
  }
  });
  }
  function feedTags(){
  fetch(U+R+K+W).then(function(r){
  return r.json();
  }).then(function(d){
  if(!d.posts)return;
  var m={};
  d.posts.forEach(function(p){
  var s=p.slug;
  var tags=[];
  if(p.tags){
  p.tags.forEach(function(t){
  var n=t.name;
  if(n.charAt(0)==='#')return;
  var i=skip.indexOf(t.slug);
  if(i===-1){
  tags.push({
  slug:t.slug,
  name:t.name
  });
  }
  });
  }
  m[s]=tags;
  });
  tagMap=m;
  applyFeedTags();
  watchForMore();
  });
  }
  function watchForMore(){
  var sel='.gh-loadmore';
  var btn=document.querySelector(
  sel);
  if(btn){
  btn.addEventListener('click',
  function(){
  setTimeout(applyFeedTags,500);
  setTimeout(applyFeedTags,1500);
  setTimeout(applyFeedTags,3000);
  });
  }
  var pf=document.querySelectorAll(
  '.post-feed');
  if(pf.length){
  var obs=new MutationObserver(
  function(){
  applyFeedTags();
  });
  pf.forEach(function(el){
  obs.observe(el,{
  childList:true,
  subtree:true
  });
  });
  }
  }
  function singleTags(){
  var sel='h1.single-title';
  var ti=document.querySelector(
  sel);
  if(!ti)return;
  var pa=ti.parentNode;
  var cls='.single-post-tags';
  if(pa.querySelector(cls))return;
  var path=window.location.pathname;
  var parts=path.split('/');
  parts=parts.filter(Boolean);
  var slug=parts.pop();
  var url=U+R+K;
  url+='&filter=slug:'+slug;
  url+='&include=tags';
  fetch(url).then(function(r){
  return r.json();
  }).then(function(d){
  if(!d.posts)return;
  if(!d.posts[0])return;
  var pt=d.posts[0].tags;
  if(!pt)return;
  var tags=pt.filter(function(t){
  var n=t.name;
  if(n.charAt(0)==='#')return false;
  var i=skip.indexOf(t.slug);
  return i===-1;
  });
  if(!tags.length)return;
  var div=document.createElement(
  'div');
  div.className='single-post-tags';
  div.innerHTML=tags.map(
  function(t){
  var h=B+t.slug+'/">';
  return A+h+t.name+'</a>';
  }).join('');
  ti.after(div);
  });
  }
  function songbookCounts(){
  var path=window.location.pathname;
  if(path.indexOf('/songbooks')===-1){
  return;
  }
  fetch(U+P+Q).then(function(r){
  return r.json();
  }).then(function(d){
  if(!d.tags)return;
  var counts={};
  d.tags.forEach(function(t){
  var c=t.count;
  if(c&&c.posts>0){
  counts[t.slug]=c.posts;
  }
  });
  var ct=document.querySelector(
  '.gh-content');
  if(!ct)return;
  var links=ct.querySelectorAll(
  'a[href*="/tag/"]');
  links.forEach(function(a){
  if(a.closest(
  '.gh-head-actions'))return;
  if(a.classList.contains(
  'mm-songs'))return;
  var hr=a.getAttribute('href');
  var m=hr.match(
  /\/tag\/([^\/]+)/);
  if(!m)return;
  var slug=m[1];
  var n=counts[slug];
  if(!n)return;
  var sp=document.createElement(
  'span');
  sp.className='mm-count';
  var w;
  if(slug==='media'){
  w=n===1?'item':'items';
  }else{
  w=n===1?'song':'songs';
  }
  sp.textContent=n+' '+w;
  a.appendChild(sp);
  });
  });
  }
  function mediaSort(){
  var p=window.location.pathname;
  if(p.indexOf(
  '/tag/media')===-1)return false;
  var sel='article.feed';
  var arts=document.querySelectorAll(
  sel);
  if(arts.length<2)return true;
  var parent=arts[0].parentNode;
  var arr=Array.from(arts);
  arr.sort(function(a,b){
  var at=a.querySelector(
  'time.feed-date');
  var bt=b.querySelector(
  'time.feed-date');
  var ad=at?
  at.getAttribute('datetime'):'';
  var bd=bt?
  bt.getAttribute('datetime'):'';
  return bd.localeCompare(ad);
  });
  arr.forEach(function(el){
  parent.appendChild(el);
  });
  return true;
  }
  function boldMediaSrc(){
  var p=window.location.pathname;
  if(p.indexOf(
  '/tag/media')===-1)return;
  var ts=document.querySelectorAll(
  '.feed-title');
  ts.forEach(function(el){
  var t=el.textContent;
  var i=t.indexOf(':');
  if(i<=0)return;
  var src=t.substring(0,i);
  var rest=t.substring(i+1);
  el.innerHTML='<strong>'+src+
  ':</strong>'+rest;
  });
  }
  function sortFeed(){
  if(mediaSort())return;
  var sel='article.feed';
  var arts=document.querySelectorAll(
  sel);
  if(arts.length<2)return;
  var parent=arts[0].parentNode;
  var arr=Array.from(arts);
  var INTRO=[
  'mountain mover',
  'one more day',
  'barnyard polska',
  'embers in the dark',
  'huckleberry hunting',
  'i love you simply',
  'may-o','the senses'];
  var isIntro=window.location
  .pathname.indexOf(
  '/tag/free')!==-1;
  arr.sort(function(a,b){
  var at=a.querySelector(
  '.feed-title');
  var bt=b.querySelector(
  '.feed-title');
  if(!at||!bt)return 0;
  var an=at.textContent.trim();
  var bn=bt.textContent.trim();
  if(isIntro){
  var ai=INTRO.indexOf(
  an.toLowerCase());
  var bi=INTRO.indexOf(
  bn.toLowerCase());
  if(ai===-1)ai=999;
  if(bi===-1)bi=999;
  if(ai!==bi)return ai-bi;
  }
  return an.localeCompare(bn);
  });
  arr.forEach(function(el){
  parent.appendChild(el);
  });
  }
  function fixTagImg(){
  var img=document.querySelector(
  '.taxonomy-media .u-object-fit');
  if(!img)return;
  var s=img.getAttribute('src');
  if(!s)return;
  img.src=s.replace(
  /\/size\/w\d+\//,'/');
  }
  function libraryCount(){
  var path=window.location.pathname;
  var m=path.match(
  /^\/tag\/([^\/]+)/);
  if(!m)return;
  var slug=m[1];
  if(slug==='media')return;
  if(slug==='library')return;
  var hs=document.querySelectorAll(
  'h1.single-title');
  var h=null;
  for(var i=0;i<hs.length;i++){
  var el=hs[i];
  if(el.closest('.gh-head'))
  continue;
  if(el.closest('.gh-head-logo'))
  continue;
  if(el.closest('.gh-head-brand'))
  continue;
  h=el;break;
  }
  if(!h)return;
  if(h.querySelector('.mm-count'))
  return;
  fetch(U+P+Q).then(function(r){
  return r.json();
  }).then(function(d){
  if(!d.tags)return;
  var t=d.tags.find(function(x){
  return x.slug===slug;
  });
  if(!t||!t.count)return;
  var n=t.count.posts;
  var sp=document.createElement(
  'span');
  sp.className='mm-count';
  sp.style.fontSize='0.4em';
  sp.style.verticalAlign='middle';
  sp.style.marginLeft='12px';
  var w=n===1?'song':'songs';
  sp.textContent=n+' '+w;
  h.appendChild(sp);
  });
  }
  function hideTierHints(){
  if(!isMember())return;

  el.style.display='none';

*/if(!tc||!tc.parentNode)return;

  function swapPortalText(){
  function run(){
  var fs=document.querySelectorAll(
  'iframe');
  fs.forEach(function(f){
  try{
  var d=f.contentDocument;
  if(!d||!d.body)return;
  var S=[
  [/\bregular price\b/g,
  'regular amount'],
  [/\bAlready a member\b/g,
  'Already signed up'],
  [/\bBecome a member\b/g,
  'Join the Crew'],
  [/\bYour membership\b/g,
  'Your support'],
  [/\bMembership\b/g,'Crew'],
  [/\bMembers\b/g,'Crew'],
  [/\bmembership\b/g,'support'],
  [/\bmembers\b/g,'crew'],
  [/\bMember\b/g,'Crew'],
  [/\bmember\b/g,'crew']
  ];
  var W=d.createTreeWalker(
  d.body,
  NodeFilter.SHOW_TEXT,
  null);
  var tn;
  while(tn=W.nextNode()){
  var o=tn.nodeValue;
  var n=o;
  S.forEach(function(s){
  n=n.replace(s[0],s[1]);
  });
  if(n!==o){
  tn.nodeValue=n;
  }
  }
  }catch(e){}
  });
  }
  setInterval(run,500);
  }
  function fixFooterText(){
  var f=document.querySelector(
  '.gh-foot');
  if(!f)return;
  var w=document.createTreeWalker(
  f,NodeFilter.SHOW_TEXT,null);
  var tn;
  while(tn=w.nextNode()){
  var o=tn.nodeValue;
  var n=o.replace(
  /BENNETT'S MOVING MUSIC SONGBOOK/g,
  "MOVING MUSIC");
  if(n!==o)tn.nodeValue=n;
  }
  }
  function igIcon(){

  var url='https://cdn.';
  url+='simpleicons.org/';
  url+='instagram/888';
  a.innerHTML=
  '<img src="'+url+
  '" alt="Instagram" '+
  'style="width:18px;'+
  'height:18px;'+
  'vertical-align:middle">';
  }
  function init(){
  fixTagImg();
  hero();
  go();
  feedTags();
  sortFeed();
  singleTags();
  songbookCounts();
  hideTierHints();
  libraryCount();
  boldMediaSrc();
  decorateSubForm();
  hidePortalPowered();
  swapPortalTitle();
  swapPortalText();
  igIcon();
  fixFooterText();
  }
  if(document.readyState==='loading'){
  document.addEventListener(
  'DOMContentLoaded',init);
  }else{init();}
</script>

<script>
(function(){
  var K='4bb24d5f52e1f7397cb4fe24a5';
  var U='https://moving-music.ghost.io';
  var R='/ghost/api/content/posts/';
  function albumTierLabels(){
    var p=window.location.pathname;
    var m=p.match(
      /^\/tag\/(album-[^\/]+)/);
    if(!m)return;
    var tag=m[1];
    var u=U+R+'?key='+K;
    u+='&limit=all';
    u+='&filter=tag:'+tag;
    u+='&fields=slug,visibility';
    fetch(u).then(function(r){
      return r.json();
    }).then(function(d){
      if(!d.posts)return;
      var vmap={};
      d.posts.forEach(function(p){
        vmap[p.slug]=p.visibility;
      });
      applyAlbumLabels(vmap);
      var feed=document.querySelector(
        '.post-feed');
      if(feed&&window.MutationObserver){
        var obs=new MutationObserver(
          function(){
            applyAlbumLabels(vmap);
          });
        obs.observe(feed,{
          childList:true,
          subtree:true
        });
      }
    });
  }
  function applyAlbumLabels(vmap){
    var arts=document.querySelectorAll(
      'article.feed');
    arts.forEach(function(a){
      if(a.querySelector(
        '.album-tier-badge'))return;
      var lk=a.querySelector(
        'a.u-permalink');
      if(!lk)return;
      var s=lk.getAttribute('href')
        .replace(/\//g,'');
      var vis=vmap[s];
      if(!vis)return;
      var sp=document.createElement(
        'span');
      sp.className='album-tier-badge';
      if(vis==='public'){
        sp.classList.add('tier-open');
        sp.textContent=
          'No account needed';
      }else{
        sp.classList.add('tier-paid');
        sp.textContent=
          'Full access with membership';
      }
      if(s===
        'sanding-the-floor'){
        sp.className=
          'album-tier-badge tier-temp';
        sp.textContent=
          'Free to all this week!';
      }
      var ti=a.querySelector(
        '.feed-title');
      if(ti){
        ti.appendChild(sp);

      }
    });
  }
  function start(){
    albumTierLabels();
    setTimeout(albumTierLabels,500);
    setTimeout(albumTierLabels,1500);
  }
  if(document.readyState===
    'loading'){
    document.addEventListener(
      'DOMContentLoaded',start);
  }else{start();}
})();
</script>

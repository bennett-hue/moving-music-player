<!-- Keep: hide empty Lyrics / The Story / Notes sections on song pages.
     Added 2026-11-08, carried through step 8. -->
<style>
.mm-hide-empty-sections .gh-content > h2 + h2,
.mm-hide-empty-sections .gh-content > h2:last-child { display: none; }
</style>
<script>
(function () {
  var cells = document.querySelectorAll('.gh-content > h2');
  var removed = 0;
  Array.prototype.forEach.call(cells, function (h) {
    var next = h.nextElementSibling;
    // If nothing follows, or the next thing is another h2, the section
    // is empty.
    if (!next || next.tagName === 'H2') {
      h.remove();
      removed++;
    }
  });
})();
</script>

<!-- Album label on song pages, added Nov 9, 2026: a song on an album gets a second label next to its
     songbook label, linking to the album's page. To add a new album, add its tag slug, short name and
     year to ALBUMS below; an album tag that isn't listed still gets a label, named from its slug.
     To remove the labels, delete this block. -->
<style>
body.mm-inner .mm-kicker.mm-kicker--album{background:transparent;color:var(--mm-red);box-shadow:inset 0 0 0 1px currentColor}
</style>
<script>
(function(){
  var ALBUMS={
    'album-uncommon-kinship':['Uncommon Kinship','2007'],
    'album-in-the-field':['In the Field','2015'],
    'album-mountain-mover':['Mountain Mover','2026'],
    'album-edith-and-bennett':['Edith & Bennett','2011']
  };
  function run(){
    var b=document.body;
    if(!b||!b.classList.contains('mm-song'))return;
    var crumb=document.querySelector('.mm-pagehead .mm-crumb');
    if(!crumb||crumb.querySelector('.mm-kicker--album'))return;
    var after=crumb.querySelector('.mm-kicker');
    b.className.split(/\s+/).forEach(function(c){
      if(c.indexOf('tag-album-')!==0)return;
      var slug=c.slice(4),info=ALBUMS[slug];
      var name=info?info[0]:slug.slice(6).split('-').map(function(w){
        return w.charAt(0).toUpperCase()+w.slice(1);
      }).join(' ');
      var a=document.createElement('a');
      a.className='mm-kicker mm-kicker--album';
      a.href='/tag/'+slug+'/';
      a.textContent=name+' album'+(info?', '+info[1]:'');
      crumb.insertBefore(a,after?after.nextSibling:crumb.firstChild);
      after=a;
    });
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);
  else run();
})();
</script>

<!-- Sign-up notice, added Nov 12, 2026 (build queue item 4). Ghost's "You've successfully
     subscribed to" notice drew the site name in dark ink on its dark box, so the line looked
     cut off, and the notice sat over the menu and the header button. This draws the name in
     cream and moves the notice just below the header. To undo, delete this block. Move it into
     portal.css and chrome.css the next time the theme ships. -->
<style id="mm-notice-place">
iframe[title="portal-notification"]{top:var(--mm-notice-top,0px)!important}
</style>
<script>
(function () {
  var CSS = 'html body .gh-portal-notification p strong{color:#fbf8f2!important}';
  function place() {
    var h = document.querySelector('.mm-head');
    var top = h ? Math.max(0, Math.round(h.getBoundingClientRect().bottom) + 8) : 0;
    document.documentElement.style.setProperty('--mm-notice-top', top + 'px');
  }
  function dress(f) {
    var d;
    try { d = f.contentDocument; } catch (e) { return; }
    if (!d || !d.head || d.getElementById('mm-notice-fix')) return;
    var s = d.createElement('style');
    s.id = 'mm-notice-fix';
    s.textContent = CSS;
    d.head.appendChild(s);
  }
  function scan() {
    var f = document.querySelector('iframe[title="portal-notification"]');
    if (!f) return;
    place();
    dress(f);
    if (!f.__mmNotice) {
      f.__mmNotice = true;
      f.addEventListener('load', function () { dress(f); });
    }
  }
  function start() {
    scan();
    new MutationObserver(scan).observe(document.body, { childList: true, subtree: true });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>

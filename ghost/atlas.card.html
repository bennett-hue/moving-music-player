<script data-mark="tv-iframe-fit">(function(){var i=document.getElementById("tv-iframe");if(!i)return;var raf=0,B=document.body,H=document.querySelector(".mm-head");function wide(){return B.classList.contains("tv-wide")||B.classList.contains("tv-full");}function fit(){raf=0;var top=wide()?0:i.getBoundingClientRect().top+(window.scrollY||0);var bar=B.classList.contains("mm-bar-open")?document.querySelector(".mmp-bar.is-visible"):null;var b=(bar?bar.getBoundingClientRect().height:0)+(wide()?0:10);i.style.height=Math.max(360,Math.floor(window.innerHeight-top-b))+"px";head();}function head(){try{i.contentWindow.postMessage({source:"mmtv-host",action:"head",h:B.classList.contains("tv-wide")&&H?Math.ceil(H.getBoundingClientRect().height):0},"*");}catch(e){}}function bar(open){B.classList.toggle("mm-bar-open",open);fit();try{i.contentWindow.postMessage({source:"mmtv-host",action:"bar",open:open},"*");}catch(e){}}addEventListener("message",function(ev){var d=ev.data;if(ev.source!==i.contentWindow||!d)return;if(d.source==="mmtv"&&d.action==="bar"){bar(!B.classList.contains("mm-bar-open"));return;}if(d.source==="mmp-atlas"&&d.action==="play"){bar(true);return;}if(d.source!=="mmtv"||d.action!=="layout")return;var l=Math.max(0,Math.min(4000,Math.round(+d.left||0)));B.classList.toggle("tv-wide",l>0&&!!H);B.classList.toggle("tv-full",!!d.full);B.style.setProperty("--tv-left",l+"px");fit();});if(window.ResizeObserver&&H)new ResizeObserver(head).observe(H);function soon(){if(!raf)raf=requestAnimationFrame(fit);}fit();addEventListener("resize",soon);addEventListener("orientationchange",soon);setTimeout(soon,600);setTimeout(soon,2000);if(window.MutationObserver)new MutationObserver(soon).observe(document.body,{childList:true});})();</script>

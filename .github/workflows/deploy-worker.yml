# Deploys the mmp-sync worker whenever main changes under worker/.
# The worker pins the Scroll page and the Atlas map by commit, in worker/worker.js,
# so a page change reaches visitors only when that file changes and this runs.
#
# Needs one repository secret (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   a token made from Cloudflare's "Edit Cloudflare Workers" template
# The account ID below is an identifier, not a credential.
# The worker's own secrets (TV_INBOX_KEY and the Turnstile keys) live in Cloudflare.
# A deploy does not read or change them.
name: Deploy worker

on:
  push:
    branches: [main]
    paths: ['worker/**']
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 727ed48f9bdfea7a589525d7835ff2a0
      - name: Check the live worker
        run: |
          sleep 5
          want=$(grep -o "TV_SHA = '[0-9a-f]*'" worker.js | grep -o "'[0-9a-f]*'" | tr -d "'")
          curl -sS -f -m 30 -o /tmp/tv.html https://mmp-sync.bennett-727.workers.dev/tv.html
          echo "Pinned Scroll page: $want. Live page bytes: $(wc -c < /tmp/tv.html)"
          test "$(wc -c < /tmp/tv.html)" -gt 50000

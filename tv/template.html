<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Worksong Atlas</title>
<meta name="description" content="Worksong videos from around the world, tied to the Worksong Atlas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://i.ytimg.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@500;700;800&family=EB+Garamond:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  The Worksong Atlas, Scroll view (once called movingmusicTV). Built by scripts/build_tv.py from atlas-map.html and tv/finds.json.
  Edit tv/template.html and the data files, then rebuild. Do not edit tv.html by hand.
-->
<style>
:root {
  --paper: #F3EDE1; --paper2: #ebe2d1; --ink: #231F1B; --muted: #6e6359; --line: #d6c9b3;
  --brick: #8A2F22; --screen: #1b1814; --at-work: #2A8C82; --shared: #a67c52; --concert: #7b6d9a;
  --serif: 'EB Garamond', Georgia, serif; --sans: 'Work Sans', 'Helvetica Neue', Arial, sans-serif;
  --label: 'Alegreya Sans', 'Work Sans', sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font-family: var(--sans); }
body { overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--brick); outline-offset: 2px; }

.tv { display: grid; grid-template-rows: auto auto 1fr; height: 100vh; height: 100dvh; }

/* ---------- header ---------- */
.top { position: relative; z-index: 5; padding: 10px 16px 8px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; grid-template-areas: "brand cur view more" "browse browse browse browse"; gap: 0 8px; align-items: center; }
.cur { grid-area: cur; min-width: 0; font-family: var(--label); font-weight: 700; font-size: 12.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cur .cnt { font-weight: 500; margin-left: 6px; }
.browse { display: none; position: absolute; top: 100%; left: 0; right: 0; padding: 10px 16px 12px; background: var(--paper); border-bottom: 1px solid var(--line); box-shadow: 0 6px 12px rgba(35,31,27,.12); }
.top.open .browse { display: block; }
.browse .chan { padding-top: 8px; }
.site { display: none; flex-wrap: wrap; gap: 4px 16px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-family: var(--label); font-weight: 700; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
.site a { text-decoration: none; }
.site a:first-child { color: var(--brick); }
.brand { grid-area: brand; font-family: var(--serif); font-size: 24px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; line-height: 1; }
.brand .tag { display: inline-block; font-family: var(--label); font-weight: 800; font-size: 13px; letter-spacing: 0.1em; background: var(--brick); color: var(--paper); padding: 3px 6px 2px; margin-left: 4px; transform: rotate(-3deg) translateY(-3px); box-shadow: 0 1px 1px rgba(0,0,0,.18); }
.ctrl { display: flex; gap: 6px; flex-wrap: wrap; }
.chan { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 8px 0 2px; mask-image: linear-gradient(to right, #000 92%, transparent); }
.chan::-webkit-scrollbar { display: none; }
.pill { font-family: var(--label); font-weight: 700; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; border: 1px solid var(--line); background: transparent; padding: 5px 11px 4px; border-radius: 999px; white-space: nowrap; cursor: pointer; line-height: 1.1; }
.pill:hover { background: var(--paper2); }
.pill .num, .pill .cnt { color: var(--muted); font-weight: 500; }
.pill .num { margin-right: 6px; }
.pill .cnt { margin-left: 6px; }
.pill[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.pill[aria-pressed="true"] .num, .pill[aria-pressed="true"] .cnt { color: #cdbfa9; }
.pill.small { font-size: 12px; padding: 4px 9px 3px; }
.pill[disabled] { opacity: .4; cursor: default; }

/* ---------- map strip (narrow screens) ---------- */
.strip { position: relative; height: 58px; border-bottom: 1px solid var(--line); background: var(--paper2); overflow: hidden; display: none; cursor: pointer; }
.strip canvas { width: 100%; height: 100%; display: block; }
.strip .where { position: absolute; left: 10px; bottom: 7px; font-family: var(--label); font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; background: var(--paper); padding: 3px 7px 2px; box-shadow: 0 1px 2px rgba(0,0,0,.15); max-width: 70%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strip .pin { left: 50%; top: 50%; }

/* ---------- body ---------- */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; min-height: 0; grid-row: 3; }
.feed { overflow-y: auto; overscroll-behavior: contain; scroll-snap-type: y mandatory; scrollbar-width: thin; position: relative; container: feed / size; }
.feed:focus { outline: none; }
.card { height: 100%; scroll-snap-align: start; scroll-snap-stop: always; display: flex; flex-direction: column; justify-content: center; padding: 14px 20px 12px; margin: 0 auto; }
/* The card is as wide as the video can be at this window height, so the video
   fills the space and the title sits right under its left edge. 200px is room
   for the title, place and one line. */
.card.ar-16x9 { max-width: min(100%, 1500px, calc((100cqh - 200px) * 16 / 9 + 40px)); }
.card.ar-4x3 { max-width: min(100%, 1500px, calc((100cqh - 200px) * 4 / 3 + 40px)); }
.screen { position: relative; flex: 0 1 auto; width: 100%; min-height: 120px; container-type: size; display: flex; align-items: center; justify-content: center; }
.ar-16x9 .screen { aspect-ratio: 16 / 9; }
.ar-4x3 .screen { aspect-ratio: 4 / 3; }
.ar-9x16 .screen { flex: 1 1 auto; }
.frame { position: relative; background: #000; overflow: hidden; border-radius: 8px; }
.ar-16x9 .frame { width: min(100cqw, 100cqh * 16 / 9); height: min(100cqh, 100cqw * 9 / 16); }
.ar-4x3 .frame { width: min(100cqw, 100cqh * 4 / 3); height: min(100cqh, 100cqw * 3 / 4); }
.ar-9x16 .frame { width: min(100cqw, 100cqh * 9 / 16); height: min(100cqh, 100cqw * 16 / 9); }
/* Instagram's embed puts the video in a box under a 54px header, with a footer
   below. The box takes the video's own shape, but no taller than 4:5: a taller
   video plays letterboxed inside it. Each card carries --r, the video's height
   over its width, and --k, how much wider than the frame the embed must be so
   the video alone fills the frame (r / 1.25 for a tall video, else 1). The
   iframe is enlarged, shifted, and scaled when the embed would be narrower
   than its 326px minimum. */
.card.p-ig { --r: 1.7778; --k: 1.4222; }
.card.p-ig .frame { width: min(100cqw, 100cqh / var(--r)); height: min(100cqh, 100cqw * var(--r)); }
.card.p-ig.ar-4x3 .screen { aspect-ratio: 1 / var(--r); }
.live.p-ig .host { overflow: hidden; }
.live.p-ig .host iframe {
  --fw: min(100cqw, 100cqh / var(--r));
  --ew: max(calc(var(--fw) * var(--k)), 326px);
  inset: 0 auto auto 0; width: var(--ew); height: calc(var(--ew) * 5 / 4 + 300px);
  transform-origin: 0 0; transform: scale(min(1, tan(atan2(calc(var(--fw) * var(--k)), 326px)))) translate(calc(var(--ew) * (1 / var(--k) - 1) / 2), -54px);
}
.live.p-fb .frame { background: #000; }
.poster, .postmap { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.postmap { background: var(--screen); }
.posttext { position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 16px 16px; color: var(--paper); background: linear-gradient(to top, rgba(20,17,14,.9), rgba(20,17,14,0)); }
.posttext .via { font-family: var(--label); font-weight: 700; font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; color: #d9ccb6; }
.more { grid-area: more; }
.view { grid-area: view; }
.tv.m .view { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.more::after { content: " \25be"; }
.top.open .more::after { content: " \25b4"; }
.host, .host iframe, .host video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: transparent; }
.host video { background: #000; }
.sound.hint { pointer-events: none; cursor: default; }
.sound { position: absolute; z-index: 5; left: 50%; top: 14%; transform: translateX(-50%); font-family: var(--label); font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #1b1814; background: rgba(243,237,225,.95); border: 0; border-radius: 999px; padding: 9px 16px 8px; box-shadow: 0 2px 10px rgba(0,0,0,.4); cursor: pointer; }
.play { position: absolute; z-index: 2; left: 50%; top: 50%; width: 74px; height: 74px; margin: -37px 0 0 -37px; border-radius: 50%; border: 0; background: rgba(243,237,225,.94); display: grid; place-items: center; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.35); transition: transform .15s; }
.play:hover { transform: scale(1.06); }
.play svg { width: 30px; height: 30px; fill: var(--brick); margin-left: 5px; }
.live .play, .live .poster, .live .postmap, .live .posttext { display: none; }
.tape { position: absolute; z-index: 3; top: 12px; left: 12px; max-width: min(78%, 520px); background: var(--paper); color: var(--ink); padding: 5px 11px 4px; transform: rotate(-1.2deg); box-shadow: 0 1px 3px rgba(0,0,0,.3); pointer-events: none; transition: opacity .6s 2.5s; }
.tape b { display: block; font-family: var(--serif); font-weight: 600; font-size: 18px; line-height: 1.12; }
.tape span { display: block; font-family: var(--label); font-weight: 700; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 1px; }
.live .tape { opacity: 0; }
.plat { position: absolute; z-index: 2; right: 10px; bottom: 9px; font-family: var(--label); font-weight: 700; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #e9dfcc; background: rgba(27,24,20,.7); padding: 3px 7px 2px; border-radius: 3px; pointer-events: none; }
.live .plat { display: none; }

.info { flex: 0 0 auto; padding: 10px 2px 0; }
.meta { font-family: var(--label); font-weight: 700; font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.sh::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--c, #bbb); margin-right: 6px; vertical-align: 0; }
.ti { font-family: var(--serif); font-weight: 600; font-size: 21px; line-height: 1.2; margin: 4px 0 3px; }
.sum { margin: 0; font-size: 14.5px; line-height: 1.45; color: #3b342d; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.note { margin: 4px 0 0; font-family: var(--serif); font-style: italic; font-size: 16px; line-height: 1.35; color: var(--brick); }
.note .who { font-family: var(--label); font-style: normal; font-weight: 700; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; margin-right: .2em; }
.acts { display: flex; flex-wrap: wrap; gap: 6px 8px; margin-top: 9px; }
.act { font-family: var(--label); font-weight: 700; font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; text-decoration: none; border: 1px solid var(--ink); background: transparent; padding: 5px 10px 4px; border-radius: 4px; cursor: pointer; line-height: 1.1; }
.act:hover { background: var(--ink); color: var(--paper); }
.act.primary { background: var(--ink); color: var(--paper); }
.act.primary:hover { background: var(--brick); border-color: var(--brick); }

/* ---------- Map view: the full Atlas map takes the place of the videos ---------- */
.feed, .mapview { grid-column: 1; grid-row: 1; }
.mapview { position: relative; z-index: 2; min-height: 0; background: var(--paper2); }
.mapview[hidden] { display: none; }
.tv.m .feed { visibility: hidden; }
.tv.m #nowmap { display: none; }
.mapview iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }

/* ---------- side panel ---------- */
.side { border-left: 1px solid var(--line); padding: 16px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.mapwrap { position: relative; width: 100%; aspect-ratio: 3580 / 2160; background: var(--paper2); border-radius: 6px; overflow: hidden; cursor: crosshair; }
.mapwrap canvas { width: 100%; height: 100%; display: block; }
.pin { position: absolute; width: 0; height: 0; pointer-events: none; transition: left .7s cubic-bezier(.45,0,.2,1), top .7s cubic-bezier(.45,0,.2,1); }
.pin::before, .pin::after { content: ""; position: absolute; left: -6px; top: -6px; width: 12px; height: 12px; border-radius: 50%; background: var(--brick); box-shadow: 0 0 0 2px var(--paper); }
.pin::after { background: transparent; box-shadow: 0 0 0 2px var(--brick); animation: ping 1.8s ease-out infinite; }
@keyframes ping { from { transform: scale(1); opacity: .9; } to { transform: scale(3.2); opacity: 0; } }
.pin.off { display: none; }
.now .pos { font-family: var(--label); font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.now h3 { font-family: var(--serif); font-weight: 600; font-size: 24px; line-height: 1.15; margin: 4px 0 2px; }
.now .np { font-family: var(--label); font-weight: 700; font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.now p { margin: 8px 0 0; font-size: 14.5px; line-height: 1.5; color: #3b342d; }
.now .act { display: inline-block; margin-top: 10px; }
.next { border-top: 1px solid var(--line); padding-top: 12px; }
.next .lbl { font-family: var(--label); font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: block; }
.next button { margin-top: 3px; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; font-family: var(--serif); font-size: 18px; line-height: 1.2; }
.next button:hover { color: var(--brick); }
.next button::after { content: " \2193"; color: var(--brick); }
.keys, .fine { font-size: 12.5px; line-height: 1.5; color: var(--muted); margin: 0; }
.keys { display: none; }
.tv:has(.top.open) .keys { display: block; }
.fine { margin-top: auto; border-top: 1px solid var(--line); padding-top: 12px; }
kbd { font-family: var(--label); font-weight: 700; font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; background: var(--paper2); }

.empty { height: 100%; display: grid; place-items: center; text-align: center; padding: 30px; color: var(--muted); font-family: var(--serif); font-size: 20px; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px); background: var(--ink); color: var(--paper); font-family: var(--label); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 13px; padding: 9px 14px 8px; border-radius: 6px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 50; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* ---------- narrow screens ---------- */
@media (max-width: 979px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .strip { display: block; }
  .card { padding: 10px 10px 10px; justify-content: flex-start; }
  .ti { font-size: 18.5px; }
  .sum { font-size: 13.5px; }
  .act { font-size: 11.5px; padding: 5px 8px 4px; }
  .top { padding: 8px 10px 7px; }
  .brand { font-size: 22px; }
}
@media (max-width: 479px) {
  .cur { display: none; }
  .top { grid-template-columns: 1fr auto auto; grid-template-areas: "brand view more"; }
}
@media (max-width: 979px) and (max-height: 620px) {
  .strip { height: 44px; }
  .sum { -webkit-line-clamp: 1; }
}

/* ---------- short windows: one header row, less padding, more video ---------- */
@media (max-height: 820px) {
  .top { padding-top: 8px; padding-bottom: 7px; }
  .browse { padding-top: 8px; padding-bottom: 8px; }
  .card { padding-top: 8px; padding-bottom: 8px; }
}

/* A vertical video in a wide feed: the caption sits beside it, so the video gets the full height. */
@container feed (min-aspect-ratio: 1/1) and (min-width: 560px) {
  .card.ar-9x16 { flex-direction: row; justify-content: center; gap: 22px; }
  .card.ar-9x16 .screen { flex: 0 0 auto; width: auto; height: 100%; aspect-ratio: 9 / 16; min-height: 0; }
  .card.ar-9x16 .info { flex: 0 1 360px; min-width: 200px; align-self: flex-end; padding: 0 0 2px; }
  .card.ar-9x16 .plat { display: none; }  /* the caption beside names the platform */
}

/* ---------- wide windows: everything but the video sits in a left column
   (the header, the map, the entry), and the video takes the full height of
   the window on the right. Inside the site, the site's own header is laid over
   the top of the left column, and --site-h is its height. ---------- */
@media (min-width: 980px) {
  .tv { grid-template-rows: auto 1fr; grid-template-columns: 360px minmax(0, 1fr); }
  .top { grid-column: 1; grid-row: 1; padding-top: calc(10px + var(--site-h, 0px)); }
  .main { display: contents; }
  .side { grid-column: 1; grid-row: 2; min-height: 0; border-left: 0; }
  .mapwrap { flex: 0 0 auto; }
  .feed, .mapview { grid-column: 2; grid-row: 1 / 3; min-height: 0; border-left: 1px solid var(--line); }
  .tv.m .mapwrap { display: none; }
  .card { padding-top: 8px; padding-bottom: 8px; }
  .card.ar-16x9 { max-width: min(100%, calc((100cqh - 150px) * 16 / 9 + 40px)); }
  .card.ar-4x3 { max-width: min(100%, calc((100cqh - 150px) * 4 / 3 + 40px)); }
  .card.p-ig.ar-4x3 { max-width: min(100%, calc((100cqh - 150px) / var(--r) + 40px)); }
  /* A vertical video: one entry beside it (credit, title, Bennett's line, the
     Atlas text), and the map takes the rest. */
  .tv.v { grid-template-columns: minmax(340px, 1fr) min(66%, calc((100dvh - 16px) * 0.5625 + 362px)); }
  .tv.v .now > :not(.pos) { display: none; }
  .tv.v .card.ar-9x16 { flex-direction: row; justify-content: flex-start; gap: 22px; }
  .tv.v .card.ar-9x16 .screen { flex: 0 1 auto; width: auto; height: 100%; aspect-ratio: 9 / 16; min-height: 0; max-width: calc(100% - 222px); }
  .tv.v .card.ar-9x16 .info { flex: 1 1 200px; min-width: 200px; align-self: flex-start; padding: 6px 0 0; max-height: 100%; overflow-y: auto; }
  .tv.v .card.ar-9x16 .plat { display: none; }
  .tv.v .card.ar-9x16 .sum { display: block; -webkit-line-clamp: none; overflow: visible; }
  .tv.v .card.ar-9x16 .ti { font-size: 24px; }
}
/* ---------- phones: the video takes the whole screen, the way Instagram,
   TikTok and YouTube Shorts do. The stage is dark. The header floats over the
   top of the video. A tall video fills the screen, with its caption over the
   bottom edge and its buttons in a rail on the right. A wide or square video
   sits mid-screen with its caption under it. Inside the site, the page hides
   its own header and lets this page cover the screen down to the player bar. ---------- */
@media (max-width: 700px) {
  html, body { background: #0f0d0b; }
  .tv { display: block; position: relative; background: #0f0d0b; --th: 44px; }
  .top { position: absolute; top: 0; left: 0; right: 0; z-index: 6; height: var(--th); padding: 9px 10px 0; border: 0; color: #f3ede1; pointer-events: none; align-items: start; }
  .top::before { content: ""; position: absolute; inset: 0 0 -26px 0; z-index: -1; background: linear-gradient(to bottom, rgba(15,13,11,.82), rgba(15,13,11,0)); pointer-events: none; }
  .top > * { pointer-events: auto; }
  .brand { font-size: 21px; padding-top: 3px; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  .top > .pill { border-color: rgba(243,237,225,.6); background: rgba(15,13,11,.45); color: #f3ede1; }
  .browse { top: var(--th); color: var(--ink); max-height: calc(100dvh - var(--th) - 20px); overflow-y: auto; }
  .site { display: flex; }
  .strip { display: none; }
  .main { position: absolute; inset: 0; display: block; }
  .feed { height: 100%; scrollbar-width: none; background: #0f0d0b; }
  .feed::-webkit-scrollbar { display: none; }
  .mapview { position: absolute; inset: var(--th) 0 0 0; }
  .tv.m .top { background: var(--paper); color: var(--ink); }
  .tv.m .top::before { display: none; }
  .tv.m .top > .pill { border-color: var(--line); background: transparent; color: var(--ink); }
  .tv.m .top > .pill.view { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .tv.m .brand { text-shadow: none; }

  .card, .card.ar-16x9, .card.ar-4x3, .card.p-ig.ar-4x3 { position: relative; max-width: none; padding: 0; justify-content: center; color: #f3ede1; }
  .frame { border-radius: 0; }
  .plat { display: none; }
  .tape { top: calc(var(--th) + 8px); left: 10px; }
  .meta { color: #c9bda9; font-size: 11.5px; }
  .ti { color: #f3ede1; font-size: 19px; }
  .sum { color: #d8cdbb; font-size: 13.5px; }
  .note { color: #f0b3a2; font-size: 15.5px; }
  .act { border-color: rgba(243,237,225,.6); color: #f3ede1; }
  .act.primary { background: #f3ede1; border-color: #f3ede1; color: #1b1814; }

  /* wide and square videos: the caption sits under the video */
  .card.ar-16x9 .screen, .card.ar-4x3 .screen { flex: 0 0 auto; min-height: 0; }
  .card.ar-16x9 .info, .card.ar-4x3 .info { padding: 12px 12px 0; }

  /* tall videos: full screen, caption over the bottom, buttons in a rail */
  .card.ar-9x16 .screen { flex: 1 1 auto; width: 100%; height: 100%; min-height: 0; }
  .card.ar-9x16 .posttext { display: none; }

<script id="tv-data" type="application/json">__TV_DATA__</script>
<script>
(function () {
  'use strict';
  var TV = JSON.parse(document.getElementById('tv-data').textContent);
  var ITEMS = [], STOPS = [], ORDER = { journey: [], newest: [] }, pendingData = null;
  var IMGW = TV.img[0], IMGH = TV.img[1];
  var RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var FRAMED = (function () { try { return window.self !== window.top; } catch (e) { return true; } })();
  var PLAT = { yt: 'YouTube', ig: 'Instagram', fb: 'Facebook', tt: 'TikTok', file: 'Video' };
  var $ = function (id) { return document.getElementById(id); };

  // ---------- land dots ----------
  var LAND = (function () {
    var raw = atob(TV.land.bits), out = [];
    for (var k = 0; k < TV.land.cols * TV.land.rows; k++) {
      if (raw.charCodeAt(k >> 3) & (1 << (k & 7))) out.push(k);
    }
    return out;
  })();

  // ---------- data: Atlas videos plus Bennett's finds ----------
  // Same rules as parse_video() in scripts/build_tv.py and parseVideo() in worker/tv.js.
  function parseVideo(url) {
    var u = String(url || '').trim(), m;
    if ((m = u.match(/(?:youtube(?:-nocookie)?\.com\/(?:watch\?(?:[^#]*?&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/))) {
      var st = u.match(/[?&#](?:t|start)=(\d+)/);
      return { p: 'yt', k: m[1], st: st ? +st[1] : 0, o: /\/shorts\//.test(u) ? 'v' : 'h' };
    }
    if ((m = u.match(/instagram\.com\/(?:[\w.]+\/)?(reels?|p|tv)\/([\w-]+)/))) return { p: 'ig', k: (m[1].indexOf('reel') === 0 ? 'reel' : m[1]) + '/' + m[2], st: 0, o: 'v' };
    if ((m = u.match(/tiktok\.com\/(?:@[\w.-]+\/video\/|player\/v1\/|embed\/v2\/)(\d+)/))) return { p: 'tt', k: m[1], st: 0, o: 'v' };
    if (/(?:^|\/\/|\.)(?:facebook\.com|fb\.watch)\//.test(u)) return { p: 'fb', k: u, st: 0, o: /\/reel\//.test(u) ? 'v' : 'h' };
    if (/\.(?:mp4|webm|m4v)(?:\?|$)/i.test(u)) return { p: 'file', k: u, st: 0, o: 'h' };
    return null;
  }
  // Same projection as atlas-map.html, so a find sits where its Atlas pin would.
  function project(lat, lon) {
    var P = TV.proj, lon2 = ((lon - P.LAM0 + 180) % 360 + 360) % 360 - 180;
    var lam = lon2 * Math.PI / 180, phi = lat * Math.PI / 180, a = Math.abs(phi);
    var y = phi * (1 + a * a * (0.112579 + a * (-0.107505 + a * 0.0273759)));
    var x = Math.log(1 + 0.11679 * Math.abs(lam)) / 0.31255;
    if (a <= 1.36258) x *= 1.22172 + Math.sqrt(Math.max(0, 2.115292 - y * y));
    else { var t = 4.5848 + Math.abs(y); x *= Math.sqrt(Math.abs(38.4304449 - t * t)); }
    if (lam < 0) x = -x;
    return [P.AX * x + P.BX, P.AY * y + P.BY];
  }
  function km(a, b) {
    var r = Math.PI / 180, h = Math.pow(Math.sin((b[0] - a[0]) * r / 2), 2) +
      Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.pow(Math.sin((b[1] - a[1]) * r / 2), 2);
    return 2 * 6371 * Math.asin(Math.sqrt(h));
  }
  function isNum(v) { return typeof v === 'number' && isFinite(v); }
  // Merge finds into the Atlas videos, then order everything. A find with an Atlas
  // tradition joins that stop; any other find is a stop of its own.
  function assemble(finds, hide) {
    var hid = {};
    (hide || []).forEach(function (h) { hid[(h && h.id) || h] = 1; });
    var stops = TV.stops.map(function (s) { return Object.assign({}, s); });
    var byId = {};
    stops.forEach(function (s, i) { byId[s.id] = i; });
    var items = TV.items.filter(function (it) { return !hid[it.id]; }).map(function (it) { return Object.assign({}, it); });
    var seen = {};
    items.forEach(function (it) { seen[it.id] = 1; });
    (finds || []).forEach(function (f) {
      if (!f || typeof f.id !== 'string' || hid[f.id] || seen[f.id]) return;
      var pv = parseVideo(f.url);
      if (!pv || !/^https:\/\//.test(f.url)) return;
      seen[f.id] = 1;
      var hasXY = isNum(f.la) && isNum(f.lo), label = String(f.label || PLAT[pv.p] + ' video');
      var si = f.tradition && byId[f.tradition] != null ? byId[f.tradition] : -1;
      if (si < 0) {
        si = stops.length;
        var st = { id: '', n: label, p: String(f.place || ''), la: hasXY ? f.la : null, lo: hasXY ? f.lo : null, s: '', u: Array.isArray(f.uses) ? f.uses : [], atlas: 0 };
        if (hasXY) { var xy = project(f.la, f.lo); st.x = xy[0]; st.y = xy[1]; }
        stops.push(st);
      }
      var it = { id: f.id, p: pv.p, k: pv.k, u: f.url, t: label, by: String(f.by || ''), st: pv.st,
        ar: (f.orient || pv.o) === 'h' ? '16:9' : '9:16', sh: String(f.shows || ''), s: si, f: 1,
        r: Array.isArray(f.wh) && f.wh[0] > 0 && f.wh[1] > 0 ? Math.max(0.4, Math.min(2.2, f.wh[1] / f.wh[0])) : 0,
        a: String(f.added || ''), n: String(f.note || '') };
      if (Array.isArray(f.uses) && f.uses.length) it.u2 = f.uses;
      if (stops[si].atlas) {
        if (f.place) it.pl = String(f.place);
        if (hasXY) { var q = project(f.la, f.lo); it.x = q[0]; it.y = q[1]; }
      }
      items.push(it);
    });
    // Journey: start in Belfast, go to the nearest place each time.
    var byStop = {};
    items.forEach(function (it, i) { (byStop[it.s] = byStop[it.s] || []).push(i); });
    var used = Object.keys(byStop).map(Number).sort(function (a, b) { return a - b; });
    var left = used.filter(function (si) { return stops[si].la != null; }), route = [], here = TV.home;
    while (left.length) {
      var best = 0, bd = Infinity;
      for (var j = 0; j < left.length; j++) {
        var s = stops[left[j]], d = km(here, [s.la, s.lo]);
        if (d < bd || (d === bd && left[j] < left[best])) { bd = d; best = j; }
      }
      var nx = left.splice(best, 1)[0];
      route.push(nx); here = [stops[nx].la, stops[nx].lo];
    }
    route = route.concat(used.filter(function (si) { return stops[si].la == null; }));
    var rank = { 'at-work': 0, shared: 1, concert: 2 };
    function r(i) { var v = rank[items[i].sh]; return v == null ? 3 : v; }
    var journey = [];
    route.forEach(function (si) {
      byStop[si].slice().sort(function (a, b) { return (items[b].f - items[a].f) || (r(a) - r(b)) || (a - b); })
        .forEach(function (i) { journey.push(i); });
    });
    var fresh = journey.filter(function (i) { return items[i].f; })
      .sort(function (a, b) { return (items[b].a || '').localeCompare(items[a].a || ''); });
    return { items: items, stops: stops, order: { journey: journey, newest: fresh.concat(journey.filter(function (i) { return !items[i].f; })) } };
  }
  function commit(d) { ITEMS = d.items; STOPS = d.stops; ORDER = d.order; }
  function applyPending() { if (pendingData) { commit(pendingData); pendingData = null; updateFine(); } }
  commit(assemble(TV.finds, TV.hide));

  // ---------- state ----------
  var state = { channel: 'all', order: 'newest', atWork: false, autoplay: true, engaged: false, list: [], cur: -1, trail: [] };
  var live = null, pendingPlay = -1, settleTimer = 0;

  function uses(it) { return it.u2 || STOPS[it.s].u || []; }
  function inChannel(it, ch) {
    if (ch === 'all') return true;
    if (ch === 'finds') return !!it.f;
    return uses(it).indexOf(ch) >= 0;
  }
  function passes(it, ch) { return inChannel(it, ch) && (!state.atWork || it.sh === 'at-work'); }
  function computeList() {
    state.list = ORDER[state.order].filter(function (i) { return passes(ITEMS[i], state.channel); });
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function placeOf(it) { return it.pl || STOPS[it.s].p || ''; }
  function xyOf(it) { var s = STOPS[it.s]; return it.x != null ? [it.x, it.y] : (s.x != null ? [s.x, s.y] : null); }
  function atlasUrl(st) { return TV.site + '/atlas/#tradition=' + st.id + '&view=map'; }
  function shareUrl(it) { return TV.site + '/atlas/#v=' + it.id; }
  function creditLine(it) {
    var who = it.by || '';
    if ((it.p === 'ig' || it.p === 'tt') && /^@?[\w.]+$/.test(who)) who = '@' + who.replace(/^@/, '');
    if (it.p === 'file') return who ? 'Video from ' + who : 'Video';
    return who ? who + ' on ' + PLAT[it.p] : PLAT[it.p];
  }

  // ---------- channels ----------
  function renderChannels() {
    var cnt = function (id) { return ORDER.journey.filter(function (i) { return passes(ITEMS[i], id); }).length; };
    var chans = [['all', 'All', '', cnt('all')]].concat([['finds', "Bennett's picks", '', cnt('finds')]]);
    TV.uses.forEach(function (u, n) { chans.push([u[0], u[1], String(n + 1), u[2]]); });
    var html = chans.map(function (c) {
      var count = c[3] != null ? c[3] : cnt(c[0]);
      return '<button class="pill" data-ch="' + c[0] + '" aria-pressed="' + (state.channel === c[0]) + '"' +
        (count ? '' : ' disabled') + (c[3] ? ' title="' + esc(c[3]) + '"' : '') + '>' +
        (c[2] ? '<span class="num">' + c[2] + '</span>' : '') + esc(c[1]) + '<span class="cnt">' + count + '</span></button>';
    }).join('');
    $('chan').innerHTML = html;
    var cur = chans.filter(function (c) { return state.channel === c[0]; })[0];
    $('cur').innerHTML = cur ? esc(cur[1]) + '<span class="cnt">' + cur[3] + '</span>' : '';
  }
  $('chan').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-ch]');
    if (b && !b.disabled) setChannel(b.getAttribute('data-ch'));
  });
  function setChannel(ch, startAt) {
    state.channel = ch;
    renderChannels();
    var active = document.querySelector('.pill[data-ch="' + ch + '"]');
    if (active && active.scrollIntoView) active.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    rebuild(startAt);
  }

  // ---------- feed ----------
  var io = null, posterIO = null;
  function cardHtml(i, n, total) {
    var it = ITEMS[i], st = STOPS[it.s];
    var ar = it.ar === '9:16' ? 'ar-9x16' : it.ar === '4:3' ? 'ar-4x3' : 'ar-16x9';
    // An Instagram video whose shape is known: tall ones keep the vertical layout, the rest sit like wide videos.
    var shape = '';
    if (it.p === 'ig' && it.r) {
      ar = it.r >= 1.5 ? 'ar-9x16' : 'ar-4x3';
      shape = ' style="--r:' + it.r.toFixed(4) + ';--k:' + Math.max(1, it.r / 1.25).toFixed(4) + '"';
    }
    var shows = TV.shows[it.sh];
    var poster;
    if (it.p === 'yt') {
      poster = '<img class="poster" loading="lazy" decoding="async" alt="" src="https://i.ytimg.com/vi/' + esc(it.k) + '/hqdefault.jpg">';
    } else {
      poster = '<canvas class="postmap" aria-hidden="true"></canvas><div class="posttext"><div class="via">' +
        esc(creditLine(it)) + '</div></div>';
    }
    var acts = '';
    if (st.atlas) acts += '<a class="act primary" data-a="map" data-s="Map" target="_top" href="' + esc(atlasUrl(st)) + '">On the map</a>';
    if (FRAMED && it.p === 'yt') acts += '<button class="act" data-a="bar" data-s="Bar" title="Keep listening while you browse the site">Play in bar</button>';
    acts += '<a class="act" data-s="Open" target="_blank" rel="noopener noreferrer" href="' + esc(it.u) + '">' + (it.p === 'file' ? 'Open video' : PLAT[it.p]) + ' &#8599;</a>';
    acts += '<button class="act" data-a="copy" data-s="Link">Copy link</button>';
    var tapeTitle = st.atlas ? st.n : "Bennett's picks";
    var tapeSub = placeOf(it);
    return '<article class="card p-' + it.p + ' ' + ar + '"' + shape + ' data-n="' + n + '" id="v-' + esc(it.id) + '" aria-posinset="' + (n + 1) +
      '" aria-setsize="' + total + '" aria-labelledby="t-' + n + '">' +
      '<div class="screen"><div class="frame">' + poster +
      '<button class="play" data-a="play" aria-label="Play: ' + esc(it.t) + '"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg></button></div>' +
      '<div class="tape"><b>' + esc(tapeTitle) + '</b>' + (tapeSub ? '<span>' + esc(tapeSub) + '</span>' : '') + '</div>' +
      '<span class="plat">' + PLAT[it.p] + '</span></div>' +
      '<div class="info"><div class="meta">' +
      (shows ? '<span class="sh" style="--c:' + shows[1] + '">' + esc(shows[0]) + '</span>' : '') +
      '<span>' + esc(creditLine(it)) + '</span></div>' +
      '<h2 class="ti" id="t-' + n + '">' + esc(it.t) + '</h2>' +
      (it.n ? '<p class="note"><span class="who">Bennett</span> ' + esc(it.n) + '</p>' : '') +
      (st.s ? '<p class="sum">' + esc(st.s) + '</p>' : '') +
      '<div class="acts">' + acts + '</div></div></article>';
  }

  function rebuild(startAt) {
    if (pendingData) {  // newer finds arrived while a video was playing: use them now
      var keepId = startAt != null && ITEMS[startAt] ? ITEMS[startAt].id : null;
      applyPending();
      renderChannels();
      if (keepId) { startAt = null; for (var q = 0; q < ITEMS.length; q++) if (ITEMS[q].id === keepId) { startAt = q; break; } }
    }
    unmount();
    computeList();
    var feed = $('feed');
    if (io) io.disconnect();
    if (posterIO) posterIO.disconnect();
    if (!state.list.length) {
      feed.innerHTML = '<div class="empty">No videos here yet.</div>';
      state.cur = -1; updatePanels();
      return;
    }
    var total = state.list.length;
    feed.innerHTML = state.list.map(function (i, n) { return cardHtml(i, n, total); }).join('');
    state.cur = -1;
    io = new IntersectionObserver(onVisible, { root: feed, threshold: [0.6] });
    posterIO = new IntersectionObserver(onNear, { root: feed, rootMargin: '150% 0px' });

    if (startAt != null) { var k = state.list.indexOf(startAt); if (k >= 0) target = k; }
    jump(target, false);
  }

  function cardAt(n) { return $('feed').children[n] || null; }
  function jump(n, smooth) {
    var c = cardAt(n);

    $('feed').scrollTo({ top: c.offsetTop, behavior: smooth && !RM ? 'smooth' : 'auto' });

  function go(n, play) {

  function onVisible(entries) {
    entries.forEach(function (en) {
      if (en.isIntersecting) setCur(+en.target.getAttribute('data-n'));

  }
  function onNear(entries) {
    entries.forEach(function (en) {
      if (!en.isIntersecting) return;
      var cv = en.target.querySelector('.postmap');
      if (cv && !cv.dataset.drawn) { drawPostcard(cv, ITEMS[state.list[+en.target.getAttribute('data-n')]]); cv.dataset.drawn = '1'; }

  }

  function setCur(n) {
    if (n === state.cur) { maybePlay(n); return; }

    var s = it.s;
    if (state.trail[state.trail.length - 1] !== s) { state.trail.push(s); if (state.trail.length > 14) state.trail.shift(); }

  }

  // ---------- players ----------
  var ytReady = null;
  function loadYT() {
    if (ytReady) return ytReady;

      var prev = window.onYouTubeIframeAPIReady;

    f.setAttribute('allowfullscreen', '');

    $('fine').innerHTML = ITEMS.length + ' videos from ' + Object.keys(places).length + ' places. ' +
      'Each video plays from its original post, with credit to whoever posted it. ' +
      'To have a video taken down, <a target="_top" href="' + TV.site + '/about/">contact Bennett</a>.';
  }

  var want = readState();
  function startTarget() { return itemFor(want); }
  function start() {
    var startAt = startTarget(), ch = 'all';
    if (want.channel && (want.channel === 'finds' || TV.uses.some(function (u) { return u[0] === want.channel; }))) ch = want.channel;
    if (startAt != null && !passes(ITEMS[startAt], ch)) ch = 'all';
    state.channel = ch;
    updateFine();
    renderChannels();
    rebuild(startAt);
  }
  start();
  $('feed').focus({ preventScroll: true });
  // A link to the map view, or to a tradition that has no video yet, opens the map.
  if (want.view === 'map' || (want.tradition && startTarget() == null)) openMap(want.tradition || '');

  // Live finds: tv/finds.json on main plus the Send button inbox, through the worker.
  // Until something plays, the feed redraws with them; after that they wait for
  // the next channel or order change, so nothing jumps under a playing video.
  if (TV.live && window.fetch) {
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 8000);
    fetch(TV.live, ctl ? { signal: ctl.signal } : undefined)
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        clearTimeout(timer);
        if (!d || !Array.isArray(d.finds)) return;
        var fresh = assemble(d.finds, d.hide);
        var sig = function (o) { return o.order.journey.map(function (i) { var it = o.items[i]; return it.id + '|' + it.t + '|' + it.s + '|' + it.n; }).join(','); };
        if (sig(fresh) === sig({ items: ITEMS, order: ORDER })) return;
        if (state.engaged) { pendingData = fresh; return; }
        var curId = state.cur >= 0 ? ITEMS[state.list[state.cur]].id : null;
        commit(fresh);
        var target = startTarget();
        if (target == null && curId) { for (var i = 0; i < ITEMS.length; i++) if (ITEMS[i].id === curId) { target = i; break; } }
        state.trail = [];
        updateFine();
        renderChannels();
        rebuild(target);
      })
      .catch(function () { clearTimeout(timer); });
  }
})();
</script>
</body>
</html>

<script>
(function () {
  'use strict';
  var TV = JSON.parse(document.getElementById('tv-data').textContent);
  var ITEMS = [], STOPS = [], ORDER = { journey: [], newest: [] }, pendingData = null;
  var IMGW = TV.img[0], IMGH = TV.img[1];
  var RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var FRAMED = (function () { try { return window.self !== window.top; } catch (e) { return true; } })();
  var PLAT = { yt: 'YouTube', ig: 'Instagram', fb: 'Facebook', tt: 'TikTok', file: 'Video' };
  var $ = function (id) { return document.getElementById(id); };

  // ---------- land dots ----------
  var LAND = (function () {
    var raw = atob(TV.land.bits), out = [];
    for (var k = 0; k < TV.land.cols * TV.land.rows; k++) {
      if (raw.charCodeAt(k >> 3) & (1 << (k & 7))) out.push(k);
    }
    return out;
  })();

  // ---------- data: Atlas videos plus Bennett's finds ----------
  // Same rules as parse_video() in scripts/build_tv.py and parseVideo() in worker/tv.js.
  function parseVideo(url) {
    var u = String(url || '').trim(), m;
    if ((m = u.match(/(?:youtube(?:-nocookie)?\.com\/(?:watch\?(?:[^#]*?&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/))) {
      var st = u.match(/[?&#](?:t|start)=(\d+)/);
      return { p: 'yt', k: m[1], st: st ? +st[1] : 0, o: /\/shorts\//.test(u) ? 'v' : 'h' };
    }
    if ((m = u.match(/instagram\.com\/(?:[\w.]+\/)?(reels?|p|tv)\/([\w-]+)/))) return { p: 'ig', k: (m[1].indexOf('reel') === 0 ? 'reel' : m[1]) + '/' + m[2], st: 0, o: 'v' };
    if ((m = u.match(/tiktok\.com\/(?:@[\w.-]+\/video\/|player\/v1\/|embed\/v2\/)(\d+)/))) return { p: 'tt', k: m[1], st: 0, o: 'v' };
    if (/(?:^|\/\/|\.)(?:facebook\.com|fb\.watch)\//.test(u)) return { p: 'fb', k: u, st: 0, o: /\/reel\//.test(u) ? 'v' : 'h' };
    if (/\.(?:mp4|webm|m4v)(?:\?|$)/i.test(u)) return { p: 'file', k: u, st: 0, o: 'h' };
    return null;
  }
  // Same projection as atlas-map.html, so a find sits where its Atlas pin would.
  function project(lat, lon) {
    var P = TV.proj, lon2 = ((lon - P.LAM0 + 180) % 360 + 360) % 360 - 180;
    var lam = lon2 * Math.PI / 180, phi = lat * Math.PI / 180, a = Math.abs(phi);
    var y = phi * (1 + a * a * (0.112579 + a * (-0.107505 + a * 0.0273759)));
    var x = Math.log(1 + 0.11679 * Math.abs(lam)) / 0.31255;
    if (a <= 1.36258) x *= 1.22172 + Math.sqrt(Math.max(0, 2.115292 - y * y));
    else { var t = 4.5848 + Math.abs(y); x *= Math.sqrt(Math.abs(38.4304449 - t * t)); }
    if (lam < 0) x = -x;
    return [P.AX * x + P.BX, P.AY * y + P.BY];
  }
  function km(a, b) {
    var r = Math.PI / 180, h = Math.pow(Math.sin((b[0] - a[0]) * r / 2), 2) +
      Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.pow(Math.sin((b[1] - a[1]) * r / 2), 2);
    return 2 * 6371 * Math.asin(Math.sqrt(h));
  }
  function isNum(v) { return typeof v === 'number' && isFinite(v); }
  // Merge finds into the Atlas videos, then order everything. A find with an Atlas
  // tradition joins that stop; any other find is a stop of its own.
  function assemble(finds, hide) {
    var hid = {};
    (hide || []).forEach(function (h) { hid[(h && h.id) || h] = 1; });
    var stops = TV.stops.map(function (s) { return Object.assign({}, s); });
    var byId = {};
    stops.forEach(function (s, i) { byId[s.id] = i; });
    var items = TV.items.filter(function (it) { return !hid[it.id]; }).map(function (it) { return Object.assign({}, it); });
    var seen = {};
    items.forEach(function (it) { seen[it.id] = 1; });
    (finds || []).forEach(function (f) {
      if (!f || typeof f.id !== 'string' || hid[f.id] || seen[f.id]) return;
      var pv = parseVideo(f.url);
      if (!pv || !/^https:\/\//.test(f.url)) return;
      seen[f.id] = 1;
      var hasXY = isNum(f.la) && isNum(f.lo), label = String(f.label || PLAT[pv.p] + ' video');
      var si = f.tradition && byId[f.tradition] != null ? byId[f.tradition] : -1;
      if (si < 0) {
        si = stops.length;
        var st = { id: '', n: label, p: String(f.place || ''), la: hasXY ? f.la : null, lo: hasXY ? f.lo : null, s: '', u: Array.isArray(f.uses) ? f.uses : [], atlas: 0 };
        if (hasXY) { var xy = project(f.la, f.lo); st.x = xy[0]; st.y = xy[1]; }
        stops.push(st);
      }
      var it = { id: f.id, p: pv.p, k: pv.k, u: f.url, t: label, by: String(f.by || ''), st: pv.st,
        ar: (f.orient || pv.o) === 'h' ? '16:9' : '9:16', sh: String(f.shows || ''), s: si, f: 1,
        a: String(f.added || ''), n: String(f.note || '') };
      if (Array.isArray(f.uses) && f.uses.length) it.u2 = f.uses;
      if (stops[si].atlas) {
        if (f.place) it.pl = String(f.place);
        if (hasXY) { var q = project(f.la, f.lo); it.x = q[0]; it.y = q[1]; }
      }
      items.push(it);
    });
    // Journey: start in Belfast, go to the nearest place each time.
    var byStop = {};
    items.forEach(function (it, i) { (byStop[it.s] = byStop[it.s] || []).push(i); });
    var used = Object.keys(byStop).map(Number).sort(function (a, b) { return a - b; });
    var left = used.filter(function (si) { return stops[si].la != null; }), route = [], here = TV.home;
    while (left.length) {
      var best = 0, bd = Infinity;
      for (var j = 0; j < left.length; j++) {
        var s = stops[left[j]], d = km(here, [s.la, s.lo]);
        if (d < bd || (d === bd && left[j] < left[best])) { bd = d; best = j; }
      }
      var nx = left.splice(best, 1)[0];
      route.push(nx); here = [stops[nx].la, stops[nx].lo];
    }
    route = route.concat(used.filter(function (si) { return stops[si].la == null; }));
    var rank = { 'at-work': 0, shared: 1, concert: 2 };
    function r(i) { var v = rank[items[i].sh]; return v == null ? 3 : v; }
    var journey = [];
    route.forEach(function (si) {
      byStop[si].slice().sort(function (a, b) { return (items[b].f - items[a].f) || (r(a) - r(b)) || (a - b); })
        .forEach(function (i) { journey.push(i); });
    });
    var fresh = journey.filter(function (i) { return items[i].f; })
      .sort(function (a, b) { return (items[b].a || '').localeCompare(items[a].a || ''); });
    return { items: items, stops: stops, order: { journey: journey, newest: fresh.concat(journey.filter(function (i) { return !items[i].f; })) } };
  }
  function commit(d) { ITEMS = d.items; STOPS = d.stops; ORDER = d.order; }
  function applyPending() { if (pendingData) { commit(pendingData); pendingData = null; updateFine(); } }
  commit(assemble(TV.finds, TV.hide));

  // ---------- state ----------
  var state = { channel: 'all', order: 'newest', atWork: false, autoplay: true, engaged: false, list: [], cur: -1, trail: [] };
  var live = null, pendingPlay = -1, settleTimer = 0;

  function uses(it) { return it.u2 || STOPS[it.s].u || []; }
  function inChannel(it, ch) {
    if (ch === 'all') return true;
    if (ch === 'finds') return !!it.f;
    return uses(it).indexOf(ch) >= 0;
  }
  function passes(it, ch) { return inChannel(it, ch) && (!state.atWork || it.sh === 'at-work'); }
  function computeList() {
    state.list = ORDER[state.order].filter(function (i) { return passes(ITEMS[i], state.channel); });
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function placeOf(it) { return it.pl || STOPS[it.s].p || ''; }
  function xyOf(it) { var s = STOPS[it.s]; return it.x != null ? [it.x, it.y] : (s.x != null ? [s.x, s.y] : null); }
  function atlasUrl(st) { return TV.site + '/atlas/#tradition=' + st.id; }
  function shareUrl(it) { return TV.site + '/tv/#v=' + it.id; }
  function creditLine(it) {
    var who = it.by || '';
    if ((it.p === 'ig' || it.p === 'tt') && /^@?[\w.]+$/.test(who)) who = '@' + who.replace(/^@/, '');
    if (it.p === 'file') return who ? 'Video from ' + who : 'Video';
    return who ? who + ' on ' + PLAT[it.p] : PLAT[it.p];
  }

  // ---------- channels ----------
  function renderChannels() {
    var cnt = function (id) { return ORDER.journey.filter(function (i) { return passes(ITEMS[i], id); }).length; };
    var chans = [['all', 'All', '', cnt('all')]].concat([['finds', "Bennett's finds", '', cnt('finds')]]);
    TV.uses.forEach(function (u, n) { chans.push([u[0], u[1], String(n + 1), u[2]]); });
    var html = chans.map(function (c) {
      var count = c[3] != null ? c[3] : cnt(c[0]);
      return '<button class="pill" data-ch="' + c[0] + '" aria-pressed="' + (state.channel === c[0]) + '"' +
        (count ? '' : ' disabled') + (c[3] ? ' title="' + esc(c[3]) + '"' : '') + '>' +
        (c[2] ? '<span class="num">' + c[2] + '</span>' : '') + esc(c[1]) + '<span class="cnt">' + count + '</span></button>';
    }).join('');
    $('chan').innerHTML = html;
    var cur = chans.filter(function (c) { return state.channel === c[0]; })[0];
    $('cur').innerHTML = cur ? esc(cur[1]) + '<span class="cnt">' + cur[3] + '</span>' : '';
  }
  $('chan').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-ch]');
    if (b && !b.disabled) setChannel(b.getAttribute('data-ch'));
  });
  function setChannel(ch, startAt) {
    state.channel = ch;
    renderChannels();
    var active = document.querySelector('.pill[data-ch="' + ch + '"]');
    if (active && active.scrollIntoView) active.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    rebuild(startAt);
  }

  // ---------- feed ----------
  var io = null, posterIO = null;
  function cardHtml(i, n, total) {
    var it = ITEMS[i], st = STOPS[it.s];
    var ar = it.ar === '9:16' ? 'ar-9x16' : it.ar === '4:3' ? 'ar-4x3' : 'ar-16x9';
    var shows = TV.shows[it.sh];
    var poster;
    if (it.p === 'yt') {
      poster = '<img class="poster" loading="lazy" decoding="async" alt="" src="https://i.ytimg.com/vi/' + esc(it.k) + '/hqdefault.jpg">';
    } else {
      poster = '<canvas class="postmap" aria-hidden="true"></canvas><div class="posttext"><div class="via">' +
        esc(creditLine(it)) + '</div></div>';
    }
    var acts = '';
    if (st.atlas) acts += '<a class="act primary" target="_top" href="' + esc(atlasUrl(st)) + '">On the Atlas</a>';
    if (FRAMED && it.p === 'yt') acts += '<button class="act" data-a="bar" title="Keep listening while you browse the site">Play in bar</button>';
    acts += '<a class="act" target="_blank" rel="noopener noreferrer" href="' + esc(it.u) + '">' + (it.p === 'file' ? 'Open video' : PLAT[it.p]) + ' &#8599;</a>';
    acts += '<button class="act" data-a="copy">Copy link</button>';
    var tapeTitle = st.atlas ? st.n : "Bennett's finds";
    var tapeSub = placeOf(it);
    return '<article class="card p-' + it.p + ' ' + ar + '" data-n="' + n + '" id="v-' + esc(it.id) + '" aria-posinset="' + (n + 1) +
      '" aria-setsize="' + total + '" aria-labelledby="t-' + n + '">' +
      '<div class="screen"><div class="frame">' + poster +
      '<button class="play" data-a="play" aria-label="Play: ' + esc(it.t) + '"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg></button></div>' +
      '<div class="tape"><b>' + esc(tapeTitle) + '</b>' + (tapeSub ? '<span>' + esc(tapeSub) + '</span>' : '') + '</div>' +
      '<span class="plat">' + PLAT[it.p] + '</span></div>' +
      '<div class="info"><div class="meta">' +
      (shows ? '<span class="sh" style="--c:' + shows[1] + '">' + esc(shows[0]) + '</span>' : '') +
      '<span>' + esc(creditLine(it)) + '</span></div>' +
      '<h2 class="ti" id="t-' + n + '">' + esc(it.t) + '</h2>' +
      (it.n ? '<p class="note"><span class="who">Bennett</span> ' + esc(it.n) + '</p>' : '') +
      (st.s ? '<p class="sum">' + esc(st.s) + '</p>' : '') +
      '<div class="acts">' + acts + '</div></div></article>';
  }

  function rebuild(startAt) {
    if (pendingData) {  // newer finds arrived while a video was playing: use them now
      var keepId = startAt != null && ITEMS[startAt] ? ITEMS[startAt].id : null;
      applyPending();
      renderChannels();
      if (keepId) { startAt = null; for (var q = 0; q < ITEMS.length; q++) if (ITEMS[q].id === keepId) { startAt = q; break; } }
    }
    unmount();
    computeList();
    var feed = $('feed');
    if (io) io.disconnect();
    if (posterIO) posterIO.disconnect();
    if (!state.list.length) {
      feed.innerHTML = '<div class="empty">No videos here yet.</div>';
      state.cur = -1; updatePanels();
      return;
    }
    var total = state.list.length;
    feed.innerHTML = state.list.map(function (i, n) { return cardHtml(i, n, total); }).join('');
    state.cur = -1;
    io = new IntersectionObserver(onVisible, { root: feed, threshold: [0.6] });
    posterIO = new IntersectionObserver(onNear, { root: feed, rootMargin: '150% 0px' });
    Array.prototype.forEach.call(feed.children, function (c) { io.observe(c); if (c.querySelector('.postmap')) posterIO.observe(c); });
    var target = 0;
    if (startAt != null) { var k = state.list.indexOf(startAt); if (k >= 0) target = k; }
    jump(target, false);
  }

  function cardAt(n) { return $('feed').children[n] || null; }
  function jump(n, smooth) {
    var c = cardAt(n);
    if (!c) return;
    $('feed').scrollTo({ top: c.offsetTop, behavior: smooth && !RM ? 'smooth' : 'auto' });
    setCur(n);
  }
  function go(n, play) {
    if (n < 0 || n >= state.list.length) return;
    if (play) pendingPlay = n;
    jump(n, true);
  }

  function onVisible(entries) {
    entries.forEach(function (en) {
      if (en.isIntersecting) setCur(+en.target.getAttribute('data-n'));
    });
  }
  function onNear(entries) {
    entries.forEach(function (en) {
      if (!en.isIntersecting) return;
      var cv = en.target.querySelector('.postmap');
      if (cv && !cv.dataset.drawn) { drawPostcard(cv, ITEMS[state.list[+en.target.getAttribute('data-n')]]); cv.dataset.drawn = '1'; }
      posterIO.unobserve(en.target);
    });
  }

  function setCur(n) {
    if (n === state.cur) { maybePlay(n); return; }
    state.cur = n;
    var it = ITEMS[state.list[n]];
    if (live && live.n !== n) unmount();
    var s = it.s;
    if (state.trail[state.trail.length - 1] !== s) { state.trail.push(s); if (state.trail.length > 14) state.trail.shift(); }
    updatePanels();
    if (!FRAMED) { try { history.replaceState(null, '', '#v=' + it.id); } catch (e) {} }
    maybePlay(n);
  }
  function maybePlay(n) {
    clearTimeout(settleTimer);
    var want = pendingPlay === n || (state.engaged && state.autoplay);
    if (!want || (live && live.n === n)) return;
    settleTimer = setTimeout(function () { if (state.cur === n) { pendingPlay = -1; mount(n); } }, pendingPlay === n ? 60 : 450);
  }

  // ---------- players ----------
  var ytReady = null;
  function loadYT() {
    if (ytReady) return ytReady;
    ytReady = new Promise(function (resolve) {
      if (window.YT && window.YT.Player) return resolve();
      var prev = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = function () { if (prev) try { prev(); } catch (e) {} resolve(); };
      var s = document.createElement('script');
      s.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(s);
    });
    return ytReady;
  }
  function frameEl(src, extra) {
    var f = document.createElement('iframe');
    f.src = src;
    f.setAttribute('allow', 'autoplay; fullscreen; encrypted-media; picture-in-picture; clipboard-write; web-share');
    f.setAttribute('allowfullscreen', '');
    f.setAttribute('title', 'Video player');
    if (extra) Object.keys(extra).forEach(function (k) { f.setAttribute(k, extra[k]); });
    return f;
  }
  function mount(n) {
    var card = cardAt(n);
    if (!card) return;
    unmount();
    var it = ITEMS[state.list[n]];
    var frame = card.querySelector('.frame');
    var host = document.createElement('div');
    host.className = 'host';
    frame.appendChild(host);
    card.classList.add('live');
    live = { n: n, it: it, card: card, host: host, yt: null, el: null };
    if (it.p === 'yt') {
      var slot = document.createElement('div');
      host.appendChild(slot);
      loadYT().then(function () {
        if (!live || live.host !== host) return;
        live.yt = new YT.Player(slot, {
          host: 'https://www.youtube-nocookie.com', videoId: it.k, width: '100%', height: '100%',
          playerVars: { autoplay: 1, playsinline: 1, rel: 0, start: it.st || 0, origin: location.origin },
          events: { onStateChange: function (e) { if (e.data === 0) ended(host); } }
        });
      });
    } else if (it.p === 'tt') {
      live.el = host.appendChild(frameEl('https://www.tiktok.com/player/v1/' + it.k + '?autoplay=1&rel=0&music_info=1&description=0&closed_caption=1'));
    } else if (it.p === 'ig') {
      live.el = host.appendChild(frameEl('https://www.instagram.com/' + it.k + '/embed/', { scrolling: 'no' }));
    } else if (it.p === 'fb') {
      var w = Math.round(frame.clientWidth), h = Math.round(frame.clientHeight);
      live.el = host.appendChild(frameEl('https://www.facebook.com/plugins/video.php?href=' + encodeURIComponent(it.u) +
        '&show_text=false&autoplay=true&mute=0&width=' + w + '&height=' + h, { scrolling: 'no' }));
    } else {
      var v = document.createElement('video');
      v.src = it.k; v.controls = true; v.autoplay = true; v.playsInline = true; v.preload = 'auto';
      v.addEventListener('ended', function () { ended(host); });
      live.el = host.appendChild(v);
      var p = v.play(); if (p && p.catch) p.catch(function () {});
    }
  }
  function unmount() {
    clearTimeout(settleTimer);
    if (!live) return;
    try { if (live.yt && live.yt.destroy) live.yt.destroy(); } catch (e) {}
    if (live.el && live.el.tagName === 'VIDEO') { try { live.el.pause(); } catch (e) {} }
    live.host.remove();
    live.card.classList.remove('live');
    live = null;
  }
  function ended(host) {
    if (!live || live.host !== host) return;
    if (state.autoplay && state.cur + 1 < state.list.length) go(state.cur + 1, true);
  }
  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (e) { return; } }
    if (!d || !d['x-tiktok-player'] || !live || !live.el || ev.source !== live.el.contentWindow) return;
    if (d.type === 'onStateChange' && d.value === 0) ended(live.host);
  });

  // ---------- card actions ----------
  $('feed').addEventListener('click', function (e) {
    var b = e.target.closest('[data-a]');
    var card = e.target.closest('.card');
    if (!card) return;
    var n = +card.getAttribute('data-n'), it = ITEMS[state.list[n]];
    if (!b) {
      if (e.target.closest('.frame') && !card.classList.contains('live')) { state.engaged = true; setCur(n); mount(n); }
      return;
    }
    var a = b.getAttribute('data-a');
    if (a === 'play') { state.engaged = true; setCur(n); mount(n); }
    else if (a === 'copy') copyText(shareUrl(it));
    else if (a === 'bar') {
      try {
        window.parent.postMessage({ source: 'mmp-atlas', action: 'play', videoId: it.k, label: it.t, startSec: it.st || 0, sourceUrl: it.u }, '*');
        unmount();
        toast('Playing in the bar');
      } catch (err) { toast('The bar is not available here'); }
    }
  });
  function copyText(t) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      ta.remove();
      toast(ok ? 'Link copied' : t);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function () { toast('Link copied'); }, fallback);
    else fallback();
  }
  var toastTimer = 0;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg; t.classList.add('on');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('on'); }, 2200);
  }

  // ---------- options ----------
  function setPressed(id, on) { $(id).setAttribute('aria-pressed', String(on)); }
  $('o-journey').addEventListener('click', function () { if (state.order === 'journey') return; state.order = 'journey'; setPressed('o-journey', true); setPressed('o-newest', false); rebuild(); });
  $('o-newest').addEventListener('click', function () { if (state.order === 'newest') return; state.order = 'newest'; setPressed('o-newest', true); setPressed('o-journey', false); rebuild(); });
  $('o-work').addEventListener('click', function () {
    var keep = state.cur >= 0 ? state.list[state.cur] : null;
    state.atWork = !state.atWork; setPressed('o-work', state.atWork);
    renderChannels(); rebuild(keep);
  });
  $('o-auto').addEventListener('click', function () { state.autoplay = !state.autoplay; setPressed('o-auto', state.autoplay); });
  $('o-more').addEventListener('click', function () {
    var top = document.querySelector('.top'), open = !top.classList.contains('open');
    top.classList.toggle('open', open);
    this.setAttribute('aria-expanded', String(open));
    setTimeout(function () { stripView = null; updatePanels(); var c = cardAt(state.cur); if (c) $('feed').scrollTo({ top: c.offsetTop }); }, 0);
  });

  // ---------- maps ----------
  function sizeCanvas(cv) {
    var dpr = Math.min(window.devicePixelRatio || 1, 2), w = cv.clientWidth, h = cv.clientHeight;
    if (!w || !h) return null;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    var g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);
    return { g: g, w: w, h: h };
  }
  function paint(cv, view, look) {
    var c = sizeCanvas(cv);
    if (!c) return null;
    var g = c.g, s = view.scale, ox = c.w / 2 - view.cx * s, oy = c.h / 2 - view.cy * s;
    if (look.bg) { g.fillStyle = look.bg; g.fillRect(0, 0, c.w, c.h); }
    g.beginPath();
    TV.outline.forEach(function (p, i) { var x = ox + p[0] * s, y = oy + p[1] * s; if (i) g.lineTo(x, y); else g.moveTo(x, y); });
    g.closePath();
    g.fillStyle = look.sea; g.fill();
    var cols = TV.land.cols, cw = IMGW / cols, rh = IMGH / TV.land.rows;
    var r = Math.max(0.55, cw * s * look.dot);
    g.fillStyle = look.land;
    g.beginPath();
    for (var j = 0; j < LAND.length; j++) {
      var k = LAND[j], x = ox + ((k % cols) + 0.5) * cw * s, y = oy + (((k / cols) | 0) + 0.5) * rh * s;
      if (x < -r || y < -r || x > c.w + r || y > c.h + r) continue;
      g.moveTo(x + r, y); g.arc(x, y, r, 0, 6.2832);
    }
    g.fill();
    return { g: g, w: c.w, h: c.h, ox: ox, oy: oy, s: s };
  }
  var LOOK_PANEL = { sea: '#e4d9c4', land: 'rgba(35,31,27,.42)', dot: 0.34 };
  var LOOK_POST = { bg: '#1b1814', sea: '#1b1814', land: 'rgba(243,237,225,.30)', dot: 0.33 };

  function stopsInList() {
    var seen = {}, out = [];
    state.list.forEach(function (i) { var it = ITEMS[i], xy = xyOf(it); if (!xy) return; var key = xy[0] + ',' + xy[1]; if (!seen[key]) { seen[key] = 1; out.push({ xy: xy, n: state.list.indexOf(i) }); } });
    return out;
  }
  function drawOverlay(m) {
    if (!m) return;
    var g = m.g;
    stopsInList().forEach(function (p) {
      g.beginPath(); g.arc(m.ox + p.xy[0] * m.s, m.oy + p.xy[1] * m.s, 2.3, 0, 6.2832);
      g.fillStyle = 'rgba(138,47,34,.55)'; g.fill();
    });
    var pts = state.trail.map(function (si) { var st = STOPS[si]; return st.x != null ? [m.ox + st.x * m.s, m.oy + st.y * m.s] : null; }).filter(Boolean);
    for (var q = 1; q < pts.length; q++) {
      g.beginPath(); g.moveTo(pts[q - 1][0], pts[q - 1][1]); g.lineTo(pts[q][0], pts[q][1]);
      g.strokeStyle = 'rgba(138,47,34,' + (0.15 + 0.6 * q / pts.length).toFixed(2) + ')';
      g.lineWidth = 1.5; g.setLineDash([3, 3]); g.stroke(); g.setLineDash([]);
    }
  }
  function panelView(cv) { var w = cv.clientWidth; return { cx: IMGW / 2, cy: IMGH / 2, scale: w / IMGW }; }
  var panelMap = null;
  function drawPanel() {
    var cv = $('map');
    if (!cv.clientWidth) return;
    panelMap = paint(cv, panelView(cv), LOOK_PANEL);
    drawOverlay(panelMap);
    placePin($('pin'), panelMap);
  }
  function placePin(pin, m) {
    var it = state.cur >= 0 ? ITEMS[state.list[state.cur]] : null, xy = it && xyOf(it);
    if (!m || !xy) { pin.classList.add('off'); return; }
    pin.classList.remove('off');
    pin.style.left = (m.ox + xy[0] * m.s) + 'px';
    pin.style.top = (m.oy + xy[1] * m.s) + 'px';
  }
  $('mapwrap').addEventListener('click', function (e) {
    if (!panelMap) return;
    var rect = e.currentTarget.getBoundingClientRect(), mx = e.clientX - rect.left, my = e.clientY - rect.top;
    var best = null, bd = 18 * 18;
    stopsInList().forEach(function (p) {
      var dx = panelMap.ox + p.xy[0] * panelMap.s - mx, dy = panelMap.oy + p.xy[1] * panelMap.s - my, d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = p; }
    });
    if (best) go(best.n, state.engaged);
  });

  // strip: a moving window on the same map, centred on the current place
  var stripView = null, stripAnim = 0;
  function stripTarget(cv) {
    var it = state.cur >= 0 ? ITEMS[state.list[state.cur]] : null, xy = it && xyOf(it);
    var s = (cv.clientWidth / IMGW) * 2.6;
    return xy ? { cx: xy[0], cy: xy[1], scale: s } : { cx: IMGW / 2, cy: IMGH / 2, scale: cv.clientWidth / IMGW };
  }
  function drawStrip() {
    var cv = $('stripmap');
    if (!cv.clientWidth) return;
    var to = stripTarget(cv), from = stripView || to;
    cancelAnimationFrame(stripAnim);
    var t0 = performance.now(), dur = RM ? 0 : 700;
    (function frame(now) {
      var k = dur ? Math.min(1, (now - t0) / dur) : 1, e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      stripView = { cx: from.cx + (to.cx - from.cx) * e, cy: from.cy + (to.cy - from.cy) * e, scale: from.scale + (to.scale - from.scale) * e };
      var m = paint(cv, stripView, LOOK_PANEL);
      drawOverlay(m);
      $('strippin').classList.toggle('off', !(state.cur >= 0 && xyOf(ITEMS[state.list[state.cur]])));
      if (k < 1) stripAnim = requestAnimationFrame(frame);
    })(t0);
  }
  $('strip').addEventListener('click', function () {
    var it = state.cur >= 0 ? ITEMS[state.list[state.cur]] : null;
    if (it && STOPS[it.s].atlas) window.open(atlasUrl(STOPS[it.s]), '_top');
  });

  function drawPostcard(cv, it) {
    var xy = xyOf(it), w = cv.clientWidth;
    if (!w) return;
    // the place sits above the centre so the play button does not cover it
    var scale = (w / IMGW) * 3.2, lift = Math.min(cv.clientHeight * 0.24, 90) / scale;
    var view = xy ? { cx: xy[0], cy: xy[1] + lift, scale: scale } : { cx: IMGW / 2, cy: IMGH / 2, scale: w / IMGW };
    var m = paint(cv, view, LOOK_POST);
    if (!m || !xy) return;
    var x = m.ox + xy[0] * m.s, y = m.oy + xy[1] * m.s;
    m.g.beginPath(); m.g.arc(x, y, 7, 0, 6.2832); m.g.fillStyle = '#8A2F22'; m.g.fill();
    m.g.lineWidth = 2.5; m.g.strokeStyle = '#F3EDE1'; m.g.stroke();
  }

  // ---------- side panel ----------
  // Inside the site, tell the page how wide the left column is, so it can lay
  // its header over it. It answers with the header's height.
  var toldHost = -1;
  function tellHost() {
    if (!FRAMED) return;
    var wide = window.matchMedia('(min-width: 980px)').matches;
    var left = wide ? Math.round(document.querySelector('.top').getBoundingClientRect().width) : 0;
    if (left === toldHost) return;
    toldHost = left;
    try { window.parent.postMessage({ source: 'mmtv', action: 'layout', left: left }, '*'); } catch (e) {}
  }
  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (ev.source !== window.parent || !d || d.source !== 'mmtv-host' || d.action !== 'head') return;
    var h = Math.max(0, Math.min(320, Math.round(+d.h || 0)));
    $('tv').style.setProperty('--site-h', h + 'px');
    drawPanel();
  });
  function updatePanels() {
    var now = $('now'), next = $('next');
    var ci = state.cur >= 0 ? ITEMS[state.list[state.cur]] : null, tv = $('tv');
    var wasV = tv.className;
    tv.classList.toggle('v', !!ci && ci.ar === '9:16');
    // The columns just changed width. Land on the current card at once, or the
    // feed snaps back to the card it was leaving.
    if (tv.className !== wasV && ci) { var cc = cardAt(state.cur); if (cc) $('feed').scrollTo({ top: cc.offsetTop }); }
    if (state.cur < 0) { now.innerHTML = ''; next.innerHTML = ''; drawPanel(); drawStrip(); return; }
    var it = ITEMS[state.list[state.cur]], st = STOPS[it.s];
    var title = st.atlas ? st.n : (placeOf(it) || it.t);
    now.innerHTML = '<div class="pos">' + (state.cur + 1) + ' of ' + state.list.length + '</div>' +
      '<h3>' + esc(title) + '</h3>' + (placeOf(it) && st.atlas ? '<div class="np">' + esc(placeOf(it)) + '</div>' : '') +
      (st.s ? '<p>' + esc(st.s) + '</p>' : '') +
      (st.atlas ? '<a class="act" target="_top" href="' + esc(atlasUrl(st)) + '">Open on the Atlas</a>' : '<p>Not on the Atlas yet.</p>');
    var nx = state.cur + 1 < state.list.length ? ITEMS[state.list[state.cur + 1]] : null;
    var nxText = !nx ? '' : nx.s === it.s ? nx.t : STOPS[nx.s].atlas ? STOPS[nx.s].n + ', ' + (placeOf(nx) || '') : (placeOf(nx) || nx.t);
    next.innerHTML = nx ? '<span class="lbl">Next</span><button type="button" id="nextbtn">' + esc(nxText.replace(/, $/, '')) + '</button>' : '<span class="lbl">End of this channel</span>';
    var nb = $('nextbtn');
    if (nb) nb.addEventListener('click', function () { go(state.cur + 1, state.engaged); });
    $('stripwhere').textContent = placeOf(it) || title;
    drawPanel();
    drawStrip();
    tellHost();
  }

  // ---------- keyboard ----------
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    var k = e.key;
    if (k === 'ArrowDown' || k === 'j' || k === 'PageDown') { e.preventDefault(); go(state.cur + 1, state.engaged && state.autoplay); }
    else if (k === 'ArrowUp' || k === 'k' || k === 'PageUp') { e.preventDefault(); go(state.cur - 1, state.engaged && state.autoplay); }
    else if (k === ' ' && tag !== 'button' && tag !== 'a') {
      e.preventDefault();
      if (live) unmount(); else if (state.cur >= 0) { state.engaged = true; mount(state.cur); }
    }
    else if (k === 'Escape') unmount();
    else if (/^[0-9]$/.test(k)) {
      var ch = k === '0' ? 'all' : (TV.uses[+k - 1] || [])[0];
      if (ch) setChannel(ch);
    }
  });

  // ---------- start ----------
  function readState() {
    var s = '', out = {};
    try { var qp = new URLSearchParams(location.search); if (qp.get('state')) s = qp.get('state'); } catch (e) {}
    if (!s && location.hash) s = location.hash.slice(1);
    s.split('&').forEach(function (kv) { var p = kv.split('='); if (p[0]) out[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || ''); });
    return out;
  }
  var resizeTimer = 0;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { stripView = null; updatePanels(); var c = cardAt(state.cur); if (c) $('feed').scrollTo({ top: c.offsetTop }); }, 150);
  });

  function updateFine() {
    var places = {};
    ITEMS.forEach(function (it) { var xy = xyOf(it); if (xy) places[Math.round(xy[0]) + ',' + Math.round(xy[1])] = 1; });
    $('fine').innerHTML = ITEMS.length + ' videos from ' + Object.keys(places).length + ' places. ' +
      'Each video plays from its original post, with credit to whoever posted it. ' +
      'To have a video taken down, <a target="_top" href="' + TV.site + '/about/">contact Bennett</a>.';
  }

  var want = readState();
  function startTarget() {
    var i;
    if (want.v) { for (i = 0; i < ITEMS.length; i++) if (ITEMS[i].id === want.v) return i; }
    else if (want.tradition) { for (i = 0; i < ORDER.journey.length; i++) if (STOPS[ITEMS[ORDER.journey[i]].s].id === want.tradition) return ORDER.journey[i]; }
    return null;
  }
  function start() {
    var startAt = startTarget(), ch = 'all';
    if (want.channel && (want.channel === 'finds' || TV.uses.some(function (u) { return u[0] === want.channel; }))) ch = want.channel;
    if (startAt != null && !passes(ITEMS[startAt], ch)) ch = 'all';
    state.channel = ch;
    updateFine();
    renderChannels();
    rebuild(startAt);
  }
  start();
  $('feed').focus({ preventScroll: true });

  // Live finds: tv/finds.json on main plus the Send button inbox, through the worker.
  // Until something plays, the feed redraws with them; after that they wait for
  // the next channel or order change, so nothing jumps under a playing video.
  if (TV.live && window.fetch) {
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 8000);
    fetch(TV.live, ctl ? { signal: ctl.signal } : undefined)
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        clearTimeout(timer);
        if (!d || !Array.isArray(d.finds)) return;
        var fresh = assemble(d.finds, d.hide);
        var sig = function (o) { return o.order.journey.map(function (i) { var it = o.items[i]; return it.id + '|' + it.t + '|' + it.s + '|' + it.n; }).join(','); };
        if (sig(fresh) === sig({ items: ITEMS, order: ORDER })) return;
        if (state.engaged) { pendingData = fresh; return; }
        var curId = state.cur >= 0 ? ITEMS[state.list[state.cur]].id : null;
        commit(fresh);
        var target = startTarget();
        if (target == null && curId) { for (var i = 0; i < ITEMS.length; i++) if (ITEMS[i].id === curId) { target = i; break; } }
        state.trail = [];
        updateFine();
        renderChannels();
        rebuild(target);
      })
      .catch(function () { clearTimeout(timer); });
  }
})();
</script>
</body>
</html>

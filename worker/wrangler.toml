name = "mmp-sync"
main = "worker.js"
compatibility_date = "2025-12-01"

# After running `wrangler kv namespace create MMP_KV`, paste the printed
# `id = "..."` value below to bind the namespace to the worker.
[[kv_namespaces]]
binding = "MMP_KV"
id = "c94ebe4713584c8a853fb7a4595a473d"

# Per-IP limits on /pick (Nov 12, 2026). Cloudflare's Rate Limiting binding;
# the period must be 10 or 60 seconds. Needs wrangler 4.36 or later; on
# wrangler 3, write these as [[unsafe.bindings]] with type = "ratelimit".
[[ratelimits]]
name = "PICK_GET_LIMIT"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "TV_INBOX_LIMIT"
namespace_id = "1003"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "PICK_POST_LIMIT"
namespace_id = "1002"
simple = { limit = 10, period = 60 }
